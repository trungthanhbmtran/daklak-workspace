services:

  # =============================
  # Infrastructure
  # =============================

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-admin_systems}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      retries: 5

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_COMPRESSION_ENABLE: "on"
      MINIO_COMPRESSION_EXTENSIONS: ".txt,.log,.csv,.json,.tar,.xml,.bin"
      MINIO_COMPRESSION_MIME_TYPES: "text/*,application/json,application/xml"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # =============================
  # App Services
  # =============================

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    image: ${DOCKER_USERNAME}/daklak-api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5G
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      hrm-service:
        condition: service_started
      user-service:
        condition: service_started
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/daklak_db?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
      CHAT_GRPC_URL: chat-service:50061
    ports:
      - "8080:8080"
    volumes:
      - ./shared/protos:/app/protos:ro

  user-service:
    image: ${DOCKER_USERNAME}/daklak-user-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_systems?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
    volumes:
      - ./shared/protos:/app/protos:ro

  hrm-service:
    image: ${DOCKER_USERNAME}/daklak-hrm-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5G
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_hrm?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
    volumes:
      - ./shared/protos:/app/protos:ro

  media-service:
    image: ${DOCKER_USERNAME}/daklak-media-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_media?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./shared/protos:/app/protos:ro

  posts-service:
    image: ${DOCKER_USERNAME}/daklak-posts-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_posts?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
      PROTO_PATH: /app/protos
    volumes:
      - ./shared/protos:/app/protos:ro

  workflow-service:
    image: ${DOCKER_USERNAME}/daklak-workflow-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_workflow?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
    volumes:
      - ./shared/protos:/app/protos:ro

  document-service:
    image: ${DOCKER_USERNAME}/daklak-document-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_document?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
    volumes:
      - ./shared/protos:/app/protos:ro

  translate-service:
    image: ${DOCKER_USERNAME}/daklak-translate-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/daklak_translation
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672

  notification-service:
    image: ${DOCKER_USERNAME}/daklak-notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
      NOTIFICATION_QUEUE: notifications
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_notification?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  chat-service:
    image: ${DOCKER_USERNAME}/daklak-chat-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_chat?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin123}@rabbitmq:5672
    volumes:
      - ./shared/protos:/app/protos:ro

  admin-frontend:
    image: ${DOCKER_USERNAME}/daklak-admin-khcn:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - api-gateway
    env_file:
      - .env.production

  portal-goverment:
    image: ${DOCKER_USERNAME}/daklak-portal-goverment:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    env_file:
      - .env.production

  # =============================
  # Migration Jobs
  # =============================

  user-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-user-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npm run prisma:migrate:prod && npm run prisma:seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_systems?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  chat-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-chat-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_chat?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  hrm-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-hrm-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_hrm?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  media-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-media-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_media?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  posts-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-posts-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_posts?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  workflow-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-workflow-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_workflow?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  document-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-document-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_document?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  report-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-report-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_report?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  api-gateway-migrate:
    image: ${DOCKER_USERNAME}/daklak-api-gateway:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/daklak_db?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  notification-service-migrate:
    image: ${DOCKER_USERNAME}/daklak-notification-service:${IMAGE_TAG:-latest}
    profiles: [ "migrate" ]
    command: >-
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_notification?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  report-service:
    image: ${DOCKER_USERNAME}/daklak-report-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - rabbitmq
      - redis
    ports:
      - "3011:3011"
      - "50562:50062"
    env_file:
      - .env.production
    environment:
      - GRPC_URL=0.0.0.0:50062
      - PORT=3011
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/admin_report?allowPublicKeyRetrieval=true&connection_limit=10&pool_timeout=15

  # =============================
  # Nginx
  # =============================

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
      - admin-frontend
      - portal-goverment

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
