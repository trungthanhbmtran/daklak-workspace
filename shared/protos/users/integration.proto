syntax = "proto3";

package integration;

service IntegrationConfigService {
  rpc GetSnapshot (Empty) returns (SnapshotResponse) {}
  rpc GetPublicKey (Empty) returns (PublicKeyResponse) {}
  
  // CRUD
  rpc CreateUpstream (UpstreamPayload) returns (UpstreamResponse) {}
  rpc GetAllUpstreams (Empty) returns (UpstreamListResponse) {}
  rpc GetUpstreamById (IdRequest) returns (UpstreamResponse) {}
  rpc UpdateUpstream (UpdateUpstreamRequest) returns (UpstreamResponse) {}
  rpc DeleteUpstream (IdRequest) returns (DeleteResponse) {}
}

message Empty {}

message IdRequest {
  string id = 1;
  string callerUserId = 2;
}

message UpdateUpstreamRequest {
  string id = 1;
  UpstreamPayload data = 2;
  string callerUserId = 3;
}

message UpstreamPayload {
  string name = 1;
  string type = 2;
  string baseUrl = 3;
  repeated string allowedPaths = 4;
  repeated string allowedMethods = 5;
  string auth = 6; // JSON string
  int32 timeoutMs = 7;
  string retry = 8; // JSON string
  int32 cacheTtlSec = 9;
  string rateLimit = 10; // JSON string
  repeated string roles = 11;
  repeated string scopes = 12;
  bool enabled = 13;
  string callerUserId = 14;
  string metadata = 15; // JSON string
}

message UpstreamResponse {
  string id = 1;
  string name = 2;
  string type = 3;
  string baseUrl = 4;
  repeated string allowedPaths = 5;
  repeated string allowedMethods = 6;
  string auth = 7; 
  int32 timeoutMs = 8;
  string retry = 9; 
  int32 cacheTtlSec = 10;
  string rateLimit = 11; 
  repeated string roles = 12;
  repeated string scopes = 13;
  int32 version = 14;
  bool enabled = 15;
  string createdAt = 16;
  string updatedAt = 17;
  string metadata = 18; // JSON string
}

message UpstreamListResponse {
  repeated UpstreamResponse data = 1;
}

message SnapshotResponse {
  int32 version = 1;
  string etag = 2;
  string upstreams = 3; // JSON array string
}

message DeleteResponse {
  bool success = 1;
}

message PublicKeyResponse {
  string publicKey = 1;
  string kid = 2;
  string alg = 3;
}
