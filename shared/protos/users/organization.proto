syntax = "proto3";

package organization;
import "common/common.proto";

// Đơn vị tổ chức + Định biên (theo OrganizationsController)
service OrganizationService {
  rpc CreateUnit (CreateUnitRequest) returns (UnitResponse);
  rpc GetOne (GetOneRequest) returns (UnitResponse);
  rpc GetOrganizationByCode (GetOrganizationByCodeRequest) returns (UnitResponse);
  rpc GetUnitScope (GetUnitScopeRequest) returns (GetUnitScopeResponse);
  rpc UpdateUnit (UpdateUnitRequest) returns (UnitResponse);
  rpc UpdateUnitScope (UpdateUnitScopeRequest) returns (UnitResponse);
  rpc DeleteUnit (DeleteUnitRequest) returns (DeleteUnitResponse);
  rpc GetFullTree (GetOrganizationsRequest) returns (OrganizationTreeResponse);
  rpc GetSubTree (GetSubTreeRequest) returns (OrganizationTreeResponse);
  rpc GetDescendants (GetDescendantsRequest) returns (GetDescendantsResponse);
  rpc GetOrganizations (GetOrganizationsRequest) returns (OrganizationTreeResponse);
  rpc SetStaffing (SetStaffingRequest) returns (StaffingResponse);
  rpc GetStaffingReport (GetStaffingReportRequest) returns (StaffingReportResponse);
  rpc SetStaffingSlot (SetStaffingSlotRequest) returns (StaffingSlotItem);  // Phân công từng vị trí (từng phó): lĩnh vực, nhiệm vụ, khu vực riêng
  rpc ListJobTitles (ListJobTitlesRequest) returns (ListJobTitlesResponse);
  rpc UpdateJobTitle (UpdateJobTitleRequest) returns (JobTitleItem);
  rpc ListUnitTypes (common.Empty) returns (ListUnitTypesResponse);
  rpc GetUnitTypeJobTemplates (GetUnitTypeJobTemplatesRequest) returns (GetUnitTypeJobTemplatesResponse);
  rpc UpdateUnitTypeJobTemplates (UpdateUnitTypeJobTemplatesRequest) returns (UpdateUnitTypeJobTemplatesResponse);
}

message GetUnitTypeJobTemplatesRequest {
  int32 unit_type_id = 1;
}

message GetUnitTypeJobTemplatesResponse {
  repeated int32 job_title_ids = 1;
}

message UpdateUnitTypeJobTemplatesRequest {
  int32 unit_type_id = 1;
  repeated int32 job_title_ids = 2;
}

message UpdateUnitTypeJobTemplatesResponse {
  bool success = 1;
}

// unit_id: nếu có thì chỉ trả về chức danh áp dụng cho loại đơn vị đó (VD Sở không có Chủ tịch)
message ListJobTitlesRequest {
  int32 unit_id = 1;
}

message UpdateJobTitleRequest {
  int32 id = 1;
  int32 domain_id = 2;              // Lĩnh vực phụ trách (0 = bỏ chọn)
  int32 geographic_area_id = 3;     // Khu vực địa lý (0 = bỏ chọn)
  repeated int32 monitored_unit_ids = 4;  // Theo dõi phòng ban
}

message IdName {
  int32 id = 1;
  string name = 2;
}

message CreateUnitRequest {
  string code = 1;
  string name = 2;
  string short_name = 3;
  int32 type_id = 4;
  int32 parent_id = 5;
  repeated int32 domain_ids = 6;  // Nhiều lĩnh vực phụ trách (từ danh mục DOMAIN)
  string scope = 7;
  string type_code = 8;
}

message UnitResponse {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string short_name = 4;
  int32 type_id = 5;
  int32 parent_id = 6;
  string hierarchy_path = 7;
  string type_name = 8;
  repeated IdName domains = 9;
  string scope = 10;
  string type_code = 11;
}

message GetOneRequest {
  int32 id = 1;
}

message GetOrganizationByCodeRequest {
  string code = 1;
}

message GetUnitScopeRequest {
  int32 id = 1;
}

message GetUnitScopeResponse {
  repeated IdName domains = 1;
  string scope = 2;
}

message UpdateUnitRequest {
  int32 id = 1;
  optional string code = 2;
  optional string name = 3;
  optional string short_name = 4;
  optional int32 type_id = 5;
  optional int32 parent_id = 6;
  optional string type_code = 7;
}

message UpdateUnitScopeRequest {
  int32 id = 1;
  repeated int32 domain_ids = 2;
  optional string scope = 3;
}

message DeleteUnitRequest {
  int32 id = 1;
}

message DeleteUnitResponse {
  bool success = 1;
  string message = 2;
}

message OrganizationUnitNode {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string short_name = 4;
  int32 type_id = 5;
  int32 parent_id = 6;
  string hierarchy_path = 7;
  string type_name = 8;
  repeated OrganizationUnitNode children = 9;
  repeated IdName domains = 10;
  string scope = 11;
  bool is_leaf = 12;   // true nếu không có đơn vị con (thành phần thấp nhất)
  int32 depth = 13;    // Độ sâu trong cây (root = 0)
  string type_code = 14;
}

message OrganizationTreeResponse {
  repeated OrganizationUnitNode nodes = 1;
}

message GetSubTreeRequest {
  int32 id = 1;
}

message GetOrganizationsRequest {
  string q = 1;
}

message SetStaffingRequest {
  int32 unit_id = 1;
  int32 job_title_id = 2;
  int32 quantity = 3;
}

message StaffingResponse {
  int32 id = 1;
  int32 unit_id = 2;
  int32 job_title_id = 3;
  int32 quantity = 4;
}

message GetStaffingReportRequest {
  int32 unit_id = 1;
}

message StaffingReportItem {
  int32 id = 1;
  int32 unit_id = 2;
  int32 job_title_id = 3;
  string job_title_name = 4;
  int32 quantity = 5;
  int32 current_count = 6;
  // Thông vị chức danh (mặc định chung)
  string job_title_domain_name = 7;
  repeated string job_title_monitored_unit_names = 8;
  string job_title_geographic_area_name = 9;
  // Phân công từng vị trí (từng phó): mỗi slot có lĩnh vực, nhiệm vụ, khu vực riêng
  repeated StaffingSlotItem slots = 10;
  repeated string current_employee_names = 11;
}

message StaffingSlotItem {
  int32 id = 1;
  int32 staffing_id = 2;
  int32 slot_order = 3;
  string description = 4;                    // Nhiệm vụ được giao
  // deprecated fields removed
  // int32 geographic_area_id = 5;
  // string geographic_area_name = 6;
  repeated IdName domains = 7;
  repeated IdName monitored_units = 8;
  repeated IdName geographic_areas = 9;
  string assigned_employee_name = 10;
  string assigned_employee_code = 11;
}

message SetStaffingSlotRequest {
  int32 staffing_id = 1;
  int32 slot_order = 2;                      // 1, 2, 3... (Phó thứ nhất, hai, ba)
  string description = 3;
  int32 geographic_area_id = 4;              // deprecated
  repeated int32 domain_ids = 5;
  repeated int32 monitored_unit_ids = 6;
  repeated int32 geographic_area_ids = 7;    // Nhiều khu vực địa lý
}

message StaffingReportResponse {
  repeated StaffingReportItem data = 1;
}

message JobTitleItem {
  int32 id = 1;
  string code = 2;
  string name = 3;
  // Lĩnh vực phụ trách (domain)
  IdName domain = 4;
  // Theo dõi phòng ban: danh sách đơn vị
  repeated IdName monitored_units = 6;
  // Khu vực địa lý phụ trách
  IdName geographic_area = 7;
  string category = 9;
  int32 rank = 10;
  string type = 11;
}

message UnitTypeItem {
  int32 id = 1;
  string code = 2;
  string name = 3;
  int32 level = 4;
}

message ListUnitTypesResponse {
  repeated UnitTypeItem data = 1;
}

message ListJobTitlesResponse {
  repeated JobTitleItem data = 1;
}

message GetDescendantsRequest {
  int32 id = 1;
}

message GetDescendantsResponse {
  repeated int32 ids = 1;
}
