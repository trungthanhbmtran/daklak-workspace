syntax = "proto3";

package pbac;
import "common/common.proto";

// PBAC: Chính sách phân quyền (Policy-Based) – Nhóm người dùng (UserGroup) + Ma trận quyền
service PbacService {
  // --- Nhóm người dùng (UserGroups) ---
  rpc CreateUserGroup (CreateUserGroupRequest) returns (UserGroupResponse);
  rpc FindAllUserGroups (common.Empty) returns (FindAllUserGroupsResponse);
  rpc FindOneUserGroup (FindOneUserGroupRequest) returns (UserGroupDetailResponse);
  rpc UpdateUserGroup (UpdateUserGroupRequest) returns (UserGroupResponse);
  rpc DeleteUserGroup (DeleteUserGroupRequest) returns (UserGroupResponse);
  
  // --- Tài nguyên & Quyền CRUD ---
  rpc GetResources (common.Empty) returns (GetResourcesResponse);
  rpc CreateResource (CreateResourceRequest) returns (ResourceResponse);
  rpc UpdateResource (UpdateResourceRequest) returns (ResourceResponse);
  rpc DeleteResource (DeleteResourceRequest) returns (DeleteResourceResponse);
}

message CreateResourceRequest {
  string code = 1;
  string name = 2;
  string service_code = 3;
}

message UpdateResourceRequest {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string service_code = 4;
}

message DeleteResourceRequest {
  int32 id = 1;
}

message DeleteResourceResponse {
  bool success = 1;
  string message = 2;
}

message ResourceResponse {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string service_code = 4;
}

message GetResourcesResponse {
  repeated ResourceResponse resources = 1;
}


message PolicyItem {
  int32 id = 1;
  int32 resource_id = 2;
  string action = 3;
  string effect = 4;
  string conditions = 5;
}

message CreateUserGroupRequest {
  string name = 1;
  string description = 2;
  repeated PolicyItem policies = 3;
}

message FindOneUserGroupRequest {
  int32 id = 1;
}

message UpdateUserGroupRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  repeated PolicyItem policies = 4;
}

message DeleteUserGroupRequest {
  int32 id = 1;
}

message UserGroupResponse {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message UserGroupDetailResponse {
  int32 id = 1;
  string name = 2;
  string description = 3;
  repeated PolicyItem policies = 4;
}

message UserGroupWithCount {
  int32 id = 1;
  string name = 2;
  string description = 3;
  int32 users_count = 4;
  int32 policies_count = 5;
}

message FindAllUserGroupsResponse {
  repeated UserGroupWithCount user_groups = 1;
}
