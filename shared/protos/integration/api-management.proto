syntax = "proto3";

package api_management.v2;

service ApiManagementService {
  rpc GetSnapshot (SnapshotRequest) returns (SnapshotResponse) {}
  
  // Connection Management
  rpc CreateConnection (CreateConnectionRequest) returns (ConnectionResponse) {}
  rpc ListConnections (ListConnectionsRequest) returns (ConnectionListResponse) {}
  rpc GetConnection (GetResourceRequest) returns (ConnectionResponse) {}
  rpc UpdateConnection (UpdateConnectionRequest) returns (ConnectionResponse) {}
  rpc DeleteConnection (GetResourceRequest) returns (DeleteResponse) {}
  rpc DisableConnection (DisableConnectionRequest) returns (ConnectionResponse) {}
  rpc PublishRevision (PublishRequest) returns (PublishResponse) {}

  // Importer
  rpc CreateImportSession (CreateImportSessionRequest) returns (ImportSessionResponse) {}
  rpc CommitImportSession (CommitImportSessionRequest) returns (CommitImportSessionResponse) {}
  
  // Auth resolution for Gateway
  rpc ResolveCredential (ResolveCredentialRequest) returns (ResolveCredentialResponse) {}
  
  // Partner Auth Validation
  rpc ValidatePartnerKey (ValidatePartnerKeyRequest) returns (ValidatePartnerKeyResponse) {}

  // Endpoints Management
  rpc CreateEndpoint (CreateEndpointRequest) returns (EndpointResponse) {}
  rpc ListEndpoints (ListEndpointsRequest) returns (EndpointListResponse) {}
  rpc GetEndpoint (GetResourceRequest) returns (EndpointResponse) {}
  rpc UpdateEndpoint (UpdateEndpointRequest) returns (EndpointResponse) {}
  rpc DeleteEndpoint (GetResourceRequest) returns (DeleteResponse) {}
  // Partner Management
  rpc CreatePartner (CreatePartnerRequest) returns (PartnerResponse) {}
  rpc ListPartners (ListPartnersRequest) returns (PartnerListResponse) {}
  rpc IssuePartnerKey (IssuePartnerKeyRequest) returns (IssuePartnerKeyResponse) {}
  rpc RevokePartnerKey (RevokePartnerKeyRequest) returns (DeleteResponse) {}

message CreatePartnerRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  string organizationId = 4;
}

message PartnerResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string organizationId = 5;
  repeated PartnerKeyResponse keys = 6;
  string createdAt = 7;
}

message PartnerKeyResponse {
  string id = 1;
  string name = 2;
  string keyPrefix = 3;
  repeated string scopes = 4;
  string status = 5;
  string expiresAt = 6;
  string lastUsedAt = 7;
  string createdAt = 8;
}

message ListPartnersRequest {
  string organizationId = 1;
}

message PartnerListResponse {
  repeated PartnerResponse data = 1;
}

message IssuePartnerKeyRequest {
  string partnerId = 1;
  string name = 2;
  repeated string scopes = 3;
  string expiresAt = 4;
}

message IssuePartnerKeyResponse {
  PartnerKeyResponse record = 1;
  string oneTimeKey = 2;
}

message RevokePartnerKeyRequest {
  string keyId = 1;
}
