syntax = "proto3";

package reports;

// Import common if needed
import "common/common.proto";

service ReportService {
  rpc GetStaffingReport (GetStaffingReportRequest) returns (StaffingReportResponse);
  rpc CreateTemplate (GenericRequest) returns (GenericResponse);
  rpc GetAllTemplates (GenericRequest) returns (GenericResponse);
  rpc GetTemplateById (GenericRequest) returns (GenericResponse);
  rpc UpdateTemplate (GenericRequest) returns (GenericResponse);
  rpc DeleteTemplate (GenericRequest) returns (GenericResponse);
  rpc GetAllWidgets (GenericRequest) returns (GenericResponse);
  rpc GetTaskStats (GenericRequest) returns (GenericResponse);
  rpc GetPostStats (GenericRequest) returns (GenericResponse);
  rpc GetKpiStats (GenericRequest) returns (GenericResponse);
  rpc GetDocumentStats (GenericRequest) returns (GenericResponse);
}

message GenericRequest {
  string payload = 1;
  string userData = 2;
}

message GenericResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message GetStaffingReportRequest {
  int32 unitId = 1;
}

message StaffingReportItem {
  int32 id = 1;
  int32 unitId = 2;
  int32 jobTitleId = 3;
  string jobTitleName = 4;
  int32 quantity = 5;
  int32 currentCount = 6;
  int32 missingCount = 7;
  bool isOver = 8;
  repeated StaffingSlotItem slots = 9;
}

message StaffingSlotItem {
  int32 id = 1;
  int32 slotOrder = 2;
  string description = 3;
  int32 userSlotId = 4;
  int32 userId = 5;
  string userFullName = 6;
}

message StaffingReportResponse {
  bool success = 1;
  repeated StaffingReportItem data = 2;
  string message = 3;
}
