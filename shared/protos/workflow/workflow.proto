syntax = "proto3";

package workflow;

import "google/protobuf/struct.proto";
import "common/common.proto";

service WorkflowService {
  // =========================================================================
  // DEFINITION MANAGEMENT (Backward-compat: giữ nguyên field numbers cũ)
  // =========================================================================
  rpc CreateWorkflow (CreateWorkflowRequest) returns (WorkflowResponse);
  rpc UpdateWorkflow (UpdateWorkflowRequest) returns (WorkflowResponse);
  rpc FindOneWorkflow (FindOneWorkflowRequest) returns (WorkflowResponse);
  rpc ListWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc DeleteWorkflow (DeleteWorkflowRequest) returns (DeleteWorkflowResponse);
  rpc FindWorkflowByCode (FindWorkflowByCodeRequest) returns (WorkflowResponse);
  rpc ListModules (common.EmptyRequest) returns (ListModulesResponse);
  rpc PublishWorkflow (PublishWorkflowRequest) returns (WorkflowResponse);
  rpc ApplyModule (ApplyModuleRequest) returns (WorkflowResponse);

  // =========================================================================
  // PROCESS CATALOG (New — additive)
  // =========================================================================
  rpc RegisterProcessType (RegisterProcessTypeRequest) returns (ProcessTypeResponse);
  rpc GetProcessType (GetProcessTypeRequest) returns (ProcessTypeResponse);
  rpc ListProcessTypes (ListProcessTypesRequest) returns (ListProcessTypesResponse);

  // =========================================================================
  // BINDING MANAGEMENT (New — additive)
  // =========================================================================
  rpc CreateProcessBinding (CreateProcessBindingRequest) returns (ProcessBindingResponse);
  rpc UpdateProcessBinding (UpdateProcessBindingRequest) returns (ProcessBindingResponse);
  rpc GetProcessBinding (GetProcessBindingRequest) returns (ProcessBindingResponse);
  rpc ListProcessBindings (ListProcessBindingsRequest) returns (ListProcessBindingsResponse);
  rpc DeactivateProcessBinding (DeactivateProcessBindingRequest) returns (ProcessBindingResponse);
  rpc ResolveBinding (ResolveBindingRequest) returns (ResolveBindingResponse);

  // =========================================================================
  // DEFINITION VALIDATION & PUBLISH (New — additive)
  // =========================================================================
  rpc ValidateWorkflowDefinition (ValidateWorkflowDefinitionRequest) returns (ValidateWorkflowDefinitionResponse);

  // =========================================================================
  // EXECUTION ENGINE (Backward-compat + extend)
  // =========================================================================
  rpc StartWorkflow (StartWorkflowRequest) returns (WorkflowInstanceResponse);
  rpc TriggerWorkflow (TriggerWorkflowRequest) returns (WorkflowInstanceResponse);
  rpc ResumeWorkflow (ResumeWorkflowRequest) returns (WorkflowInstanceResponse);
  rpc ValidateAction (ValidateActionRequest) returns (ValidateActionResponse);
  rpc GetInstance (GetInstanceRequest) returns (WorkflowInstanceResponse);
  rpc GetAllowedActions (GetAllowedActionsRequest) returns (GetAllowedActionsResponse);
  rpc GetAllowedActionsBatch (GetAllowedActionsBatchRequest) returns (GetAllowedActionsBatchResponse);
  rpc ListInstances (ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetInitialNode (GetInitialNodeRequest) returns (GetInitialNodeResponse);
  rpc GetNextNode (GetNextNodeRequest) returns (GetNextNodeResponse);

  // Start by processType (New — resolver-based, replaces hardcoded workflow code)
  rpc StartByProcessType (StartByProcessTypeRequest) returns (WorkflowInstanceResponse);

  // Submit action (New — OCC-safe, creates command)
  rpc SubmitAction (SubmitActionRequest) returns (SubmitActionResponse);

  // Domain ACK (New — domain service calls this after processing command)
  rpc AcknowledgeCommand (AcknowledgeCommandRequest) returns (AcknowledgeCommandResponse);

  // Instance history (New — additive; gateway /instances/:id/logs)
  rpc GetLogs (GetLogsRequest) returns (GetLogsResponse);

  // =========================================================================
  // API INTEGRATIONS (Backward-compat)
  // =========================================================================
  rpc CreateIntegration (CreateIntegrationRequest) returns (IntegrationResponse);
  rpc UpdateIntegration (UpdateIntegrationRequest) returns (IntegrationResponse);
  rpc FindOneIntegration (FindOneIntegrationRequest) returns (IntegrationResponse);
  rpc FindAllIntegrations (FindAllIntegrationsRequest) returns (FindAllIntegrationsResponse);
  rpc DeleteIntegration (DeleteIntegrationRequest) returns (DeleteIntegrationResponse);
}

// =============================================================================
// PROCESS CATALOG MESSAGES
// =============================================================================

message RegisterProcessTypeRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  string ownerService = 4;
  repeated string validTriggers = 5;
  repeated string validActions = 6;
  // OBSERVE | ENFORCE
  string enforcementMode = 7;
}

message GetProcessTypeRequest {
  string code = 1;
}

message ListProcessTypesRequest {
  bool activeOnly = 1;
}

message ProcessTypeResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string ownerService = 5;
  repeated string validTriggers = 6;
  repeated string validActions = 7;
  string enforcementMode = 8;
  bool isActive = 9;
}

message ListProcessTypesResponse {
  repeated ProcessTypeResponse data = 1;
}

// =============================================================================
// BINDING MESSAGES
// =============================================================================

message CreateProcessBindingRequest {
  string processTypeCode = 1;
  string definitionId = 2;
  string pinnedVersionId = 3;
  string organizationId = 4;
  string trigger = 5;
  google.protobuf.Struct criteria = 6;
  int32 priority = 7;
  string effectiveFrom = 8;
  string effectiveTo = 9;
  string createdBy = 10;
  string reason = 11;
}

message UpdateProcessBindingRequest {
  string id = 1;
  string pinnedVersionId = 2;
  string status = 3;
  int32 priority = 4;
  string effectiveTo = 5;
  string reason = 6;
  string updatedBy = 7;
}

message GetProcessBindingRequest {
  string id = 1;
}

message ListProcessBindingsRequest {
  string processTypeCode = 1;
  string organizationId = 2;
  string status = 3;
  int32 skip = 4;
  int32 take = 5;
}

message DeactivateProcessBindingRequest {
  string id = 1;
  string actorId = 2;
  string reason = 3;
}

message ProcessBindingResponse {
  string id = 1;
  string processTypeCode = 2;
  string definitionId = 3;
  string pinnedVersionId = 4;
  string organizationId = 5;
  string trigger = 6;
  int32 priority = 7;
  string status = 8;
  string effectiveFrom = 9;
  string effectiveTo = 10;
  string createdBy = 11;
  string createdAt = 12;
}

message ListProcessBindingsResponse {
  repeated ProcessBindingResponse data = 1;
  common.PaginationMeta meta = 2;
}

message ResolveBindingRequest {
  string processTypeCode = 1;
  string organizationId = 2;
  string trigger = 3;
  google.protobuf.Struct context = 4;
}

message ResolveBindingResponse {
  bool found = 1;
  string bindingId = 2;
  string definitionId = 3;
  string pinnedVersionId = 4;
  // reason why not found (e.g., NO_BINDING, AMBIGUOUS, INACTIVE)
  string reason = 5;
}

// =============================================================================
// VALIDATION MESSAGES
// =============================================================================

message ValidateWorkflowDefinitionRequest {
  string definitionId = 1;
  // optional: validate a specific version (defaults to latest DRAFT)
  string versionId = 2;
  // actor performing validation
  string actorId = 3;
}

message ValidationError {
  string nodeId = 1;
  string field = 2;
  string code = 3;
  string message = 4;
}

message ValidateWorkflowDefinitionResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
}

// =============================================================================
// START BY PROCESS TYPE (New)
// =============================================================================

message StartByProcessTypeRequest {
  string processTypeCode = 1;
  string organizationId = 2;
  string trigger = 3;
  string businessId = 4;
  string businessType = 5;
  string actorId = 6;
  string correlationId = 7;
  string idempotencyKey = 8;
  google.protobuf.Struct initialContext = 9;
}

// =============================================================================
// SUBMIT ACTION (New — OCC-safe)
// =============================================================================

message SubmitActionRequest {
  string instanceId = 1;
  string actionName = 2;
  string actorId = 3;
  string organizationId = 4;
  string correlationId = 5;
  // expected OCC version of the instance
  int32 expectedVersion = 6;
  google.protobuf.Struct actionData = 7;
  string note = 8;
  // Client-stable key: gửi lại cùng key => trả command cũ (duplicate=true), không tạo mới.
  string idempotencyKey = 9;
}

message SubmitActionResponse {
  bool accepted = 1;
  // PENDING (command created, waiting for domain ack) | COMPLETED | FAILED
  string status = 2;
  string commandId = 3;
  string reason = 4;
  int32 newVersion = 5;
  bool duplicate = 6;
}

// =============================================================================
// ACKNOWLEDGE COMMAND (New)
// =============================================================================

message AcknowledgeCommandRequest {
  string commandId = 1;
  string instanceId = 2;
  // SUCCESS | FAILURE
  string result = 3;
  int32 entityVersion = 4;
  google.protobuf.Struct payload = 5;
  string errorMessage = 6;
}

message AcknowledgeCommandResponse {
  bool accepted = 1;
  string reason = 2;
  bool duplicate = 3;
}

// =============================================================================
// INSTANCE HISTORY (New)
// =============================================================================

message GetLogsRequest {
  string instanceId = 1;
  // Org scope do gateway inject từ JWT; rỗng = không giới hạn (chỉ dùng nội bộ).
  string organizationId = 2;
}

message WorkflowLogEntry {
  string id = 1;
  string fromNodeId = 2;
  string toNodeId = 3;
  string action = 4;
  string performedBy = 5;
  string performedAt = 6;
  string comment = 7;
}

message GetLogsResponse {
  repeated WorkflowLogEntry logs = 1;
}

// =============================================================================
// EXISTING MESSAGES (Backward-compat — field numbers preserved)
// =============================================================================

message ListModulesResponse {
  repeated WorkflowModule data = 1;
}

message WorkflowModule {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  string updatedAt = 5;
}

message PublishWorkflowRequest {
  string id = 1;
  // New optional field: actor performing publish
  string actorId = 2;
  string organizationId = 3;
}

message ApplyModuleRequest {
  string id = 1;
  string moduleCode = 2;
}

message CreateWorkflowRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  int32 version = 4;
  string status = 5;
  string createdBy = 6;
  string definitionJson = 7;
  string organizationId = 8;
}

message UpdateWorkflowRequest {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  int32 version = 5;
  string status = 6;
  string definitionJson = 7;
  string organizationId = 8;
}

message FindOneWorkflowRequest {
  string id = 1;
  string organizationId = 2;
}

message FindWorkflowByCodeRequest {
  string code = 1;
  string organizationId = 2;
}

message ListWorkflowsRequest {
  int32 skip = 1;
  int32 take = 2;
  string search = 3;
  string organizationId = 4;
}

message ListWorkflowsResponse {
  repeated WorkflowResponse data = 1;
  common.PaginationMeta meta = 2;
}

message DeleteWorkflowRequest {
  string id = 1;
  string organizationId = 2;
}

message DeleteWorkflowResponse {
  bool success = 1;
}

message WorkflowResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  int32 version = 5;
  string status = 6;
  string createdBy = 7;
  string createdAt = 8;
  string updatedAt = 9;
  string definitionJson = 10;
  string trigger = 11;
  // New fields (additive, field numbers after 11)
  string publishedBy = 12;
  string publishedAt = 13;
}

message WorkflowDefinition {
  repeated WorkflowNode nodes = 1;
  repeated WorkflowEdge edges = 2;
}

message Position {
  float x = 1;
  float y = 2;
}

message Measured {
  float width = 1;
  float height = 2;
}

message WorkflowNode {
  string id = 1;
  string nodeKey = 2;
  string type = 3;
  string name = 4;
  float x = 5;
  float y = 6;
  string propertiesJson = 7;
  int32 order = 8;
  repeated AssignmentRule assignments = 9;
  repeated NodeAction actions = 10;
  Position position = 11;
  google.protobuf.Struct data = 12;
  float width = 13;
  float height = 14;
  bool selected = 15;
  Position positionAbsolute = 16;
  bool dragging = 17;
  Measured measured = 18;
}

message WorkflowEdge {
  string id = 1;
  string sourceNodeId = 2;
  string targetNodeId = 3;
  string condition = 4;
  int32 priority = 5;
  bool defaultFlow = 6;
  string propertiesJson = 7;
  string source = 8;
  string target = 9;
  string sourceHandle = 10;
  string targetHandle = 11;
  bool animated = 12;
  string label = 13;
  google.protobuf.Struct data = 14;
  string type = 15;
}

message AssignmentRule {
  string id = 1;
  string type = 2;
  string value = 3;
}

message NodeAction {
  string id = 1;
  string actionType = 2;
  string service = 3;
  string action = 4;
  google.protobuf.Struct payloadTemplate = 5;
  int32 order = 6;
}

message WorkflowVariable {
  string id = 1;
  string key = 2;
  string type = 3;
  google.protobuf.Struct defaultValue = 4;
}

message StartWorkflowRequest {
  string workflowId = 1;
  google.protobuf.Struct initialContext = 2;
  string initiatorId = 3;
  string businessId = 4;
  string businessType = 5;
}

message ValidateActionRequest {
  string instanceId = 1;
  string actionName = 2;
  repeated string userRoles = 3;
  string userId = 4;
  google.protobuf.Struct businessData = 5;
  string workflowId = 6;
  string currentNodeId = 7;
}

message ValidateActionResponse {
  bool allowed = 1;
  string reason = 2;
}

message GetAllowedActionsRequest {
  string instanceId = 1;
  repeated string userRoles = 2;
  string userId = 3;
  google.protobuf.Struct businessData = 4;
  string workflowId = 5;
  string currentNodeId = 6;
}

message GetAllowedActionsResponse {
  repeated string actions = 1;
}

message GetAllowedActionsBatchRequest {
  repeated GetAllowedActionsRequest requests = 1;
}

message GetAllowedActionsBatchResponse {
  repeated GetAllowedActionsResponse results = 1;
}

message TriggerWorkflowRequest {
  string trigger = 1;
  google.protobuf.Struct initialContext = 2;
  string initiatorId = 3;
  string businessId = 4;
  string businessType = 5;
}

message ResumeWorkflowRequest {
  string instanceId = 1;
  string nodeId = 2;
  google.protobuf.Struct actionData = 3;
  repeated string userRoles = 4;
}

message GetInstanceRequest {
  string id = 1;
  string organizationId = 2;
}

message WorkflowInstanceResponse {
  string id = 1;
  string workflowId = 2;
  string status = 3;
  string currentNodeId = 4;
  google.protobuf.Struct context = 5;
  string createdAt = 6;
  string updatedAt = 7;
  string workflowName = 8;
  repeated WorkflowTask tasks = 9;
  // New additive fields
  string processType = 10;
  string businessId = 11;
  string correlationId = 12;
  repeated string allowedActions = 13;
  // OCC version client phải gửi lại trong SubmitAction.expectedVersion
  int32 stateVersion = 14;
  string organizationId = 15;
  string businessType = 16;
  // Trạng thái command gần nhất (PENDING | SENT | ACKED | FAILED) để UI hiển thị tiến trình
  string lastCommandId = 17;
  string lastCommandStatus = 18;
  string lastCommandError = 19;
}

message ListInstancesRequest {
  int32 skip = 1;
  int32 take = 2;
  string workflowId = 3;
  string status = 4;
  string search = 5;
  string organizationId = 6;
  string processType = 7;
  string businessId = 8;
}

message ListInstancesResponse {
  repeated WorkflowInstanceResponse data = 1;
  common.PaginationMeta meta = 2;
}

message WorkflowTask {
  string id = 1;
  string instanceId = 2;
  string nodeId = 3;
  string assigneeId = 4;
  string status = 5;
  string startedAt = 6;
  string completedAt = 7;
}

message GetInitialNodeRequest {
  string workflowId = 1;
}

message GetInitialNodeResponse {
  string initialNodeId = 1;
  string nodeData = 2;
}

message GetNextNodeRequest {
  string workflowId = 1;
  string currentNodeId = 2;
  string actionName = 3;
  google.protobuf.Struct evalContext = 4;
}

message GetNextNodeResponse {
  string nextNodeId = 1;
  string nextNodeData = 2;
  string type = 3;
}

// =============================================================================
// API INTEGRATION MESSAGES (Backward-compat)
// =============================================================================

message CreateIntegrationRequest {
  string name = 1;
  string code = 2;
  string description = 3;
  string protocol = 4;
  string baseUrl = 5;
  string authType = 6;
  string authConfig = 7;
  string headers = 8;
  string endpoints = 9;
  string metadata = 10;
  bool isActive = 11;
}

message UpdateIntegrationRequest {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  string protocol = 5;
  string baseUrl = 6;
  string authType = 7;
  string authConfig = 8;
  string headers = 9;
  string endpoints = 10;
  string metadata = 11;
  bool isActive = 12;
}

message FindOneIntegrationRequest {
  string id = 1;
}

message DeleteIntegrationRequest {
  string id = 1;
}

message DeleteIntegrationResponse {
  bool success = 1;
  string message = 2;
}

message IntegrationResponse {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  string protocol = 5;
  string baseUrl = 6;
  string authType = 7;
  string authConfig = 8;
  string headers = 9;
  string endpoints = 10;
  string metadata = 11;
  bool isActive = 12;
  string createdAt = 13;
  string updatedAt = 14;
}

message IntegrationEndpoint {
  string method = 1;
  string path = 2;
  google.protobuf.Struct headers = 3;
  google.protobuf.Struct params = 4;
}

message FindAllIntegrationsRequest {
  string search = 1;
}

message FindAllIntegrationsResponse {
  repeated IntegrationResponse data = 1;
}
