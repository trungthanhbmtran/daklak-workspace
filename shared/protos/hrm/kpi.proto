syntax = "proto3";

package kpi;

import "common/common.proto";

service KpiService {
  rpc FindPeriods (FindPeriodsRequest) returns (PeriodsResponse) {}
  rpc CreatePeriod (CreatePeriodRequest) returns (PeriodResponse) {}
  rpc FindCriteria (FindCriteriaRequest) returns (CriteriaResponse) {}
  rpc CreateCriterion (CreateCriterionRequest) returns (CriterionResponse) {}
  rpc UpdateCriterion (UpdateCriterionRequest) returns (CriterionResponse) {}
  rpc DeleteCriterion (DeleteCriterionRequest) returns (DeleteCriterionResponse) {}
  rpc CreateEvaluation (CreateEvaluationRequest) returns (EvaluationResponse) {}
  rpc FindEvaluations (FindEvaluationsRequest) returns (EvaluationsResponse) {}
  rpc CalculatePersonalKpi (CalculatePersonalKpiRequest) returns (CalculatePersonalKpiResponse) {}
  rpc GetEvaluationDetail (GetEvaluationDetailRequest) returns (KpiEvaluationDetailResponse) {}
  rpc SubmitEvaluation (SubmitEvaluationRequest) returns (EvaluationResponse) {}
  rpc ApproveEvaluation (ApproveEvaluationRequest) returns (EvaluationResponse) {}
  rpc GetEvaluationStats (GetEvaluationStatsRequest) returns (GetEvaluationStatsResponse) {}
  rpc FindFormTemplates (FindFormTemplatesRequest) returns (FormTemplatesResponse) {}
  rpc GetFormTemplateDetail (GetFormTemplateDetailRequest) returns (FormTemplateDetailResponse) {}
  rpc UpdateFormTemplate (UpdateFormTemplateRequest) returns (FormTemplateDetailResponse) {}
  rpc GetFormTemplateXml (GetFormTemplateXmlRequest) returns (FormTemplateXmlResponse) {}
  rpc SaveFormTemplateXml (SaveFormTemplateXmlRequest) returns (FormTemplateXmlResponse) {}
  rpc ValidateFormTemplateXml (ValidateFormTemplateXmlRequest) returns (ValidateFormTemplateXmlResponse) {}
  rpc CreateFormTemplate (CreateFormTemplateRequest) returns (FormTemplateDetailResponse) {}
  rpc ListFormTemplateBindings (ListFormTemplateBindingsRequest) returns (FormTemplateBindingsResponse) {}
  rpc CreateFormTemplateBinding (CreateFormTemplateBindingRequest) returns (FormTemplateBindingResponse) {}
  rpc DeleteFormTemplateBinding (DeleteFormTemplateBindingRequest) returns (FormTemplateBindingResponse) {}
  rpc PublishFormTemplate (PublishFormTemplateRequest) returns (FormTemplateDetailResponse) {}
  rpc ResolveFormTemplateBinding (ResolveFormTemplateBindingRequest) returns (ResolvedFormTemplateResponse) {}
}

message FindPeriodsRequest {}

message PeriodResponse {
  int32 id = 1;
  string name = 2;
  string startDate = 3;
  string endDate = 4;
}



message PeriodsResponse {
  bool success = 1;
  string message = 2;
  repeated PeriodResponse data = 3;
  common.Meta meta = 4;
}

message CreatePeriodRequest {
  string name = 1;
  string startDate = 2;
  string endDate = 3;
}

message FindCriteriaRequest {
  bool isAdmin = 1;
  int32 page = 2;
  int32 limit = 3;
}

message CriterionResponse {
  int32 id = 1;
  string name = 2;
  float weight = 3;
  string description = 4;
  float baseScore = 5;
  string scoringMethod = 6;
  string difficulty = 7;
  float difficultyMultiplier = 8;
  int32 bonusThresholdDays = 9;
  float bonusPerDay = 10;
  float penaltyPerDay = 11;
  optional int32 categoryId = 12;
}

message CriteriaResponse {
  bool success = 1;
  string message = 2;
  repeated CriterionResponse data = 3;
  common.Meta meta = 4;
}

message CreateCriterionRequest {
  string name = 1;
  optional string description = 2;
  optional float weight = 3;
  optional float baseScore = 4;
  optional string scoringMethod = 5;
  optional string difficulty = 6;
  optional float difficultyMultiplier = 7;
  optional int32 bonusThresholdDays = 8;
  optional float bonusPerDay = 9;
  optional float penaltyPerDay = 10;
  optional int32 categoryId = 11;
}

message UpdateCriterionRequest {
  int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional float weight = 4;
  optional float baseScore = 5;
  optional string scoringMethod = 6;
  optional string difficulty = 7;
  optional float difficultyMultiplier = 8;
  optional int32 bonusThresholdDays = 9;
  optional float bonusPerDay = 10;
  optional float penaltyPerDay = 11;
  optional int32 categoryId = 12;
}

message DeleteCriterionRequest {
  int32 id = 1;
}

message DeleteCriterionResponse {
  bool success = 1;
}

message CreateEvaluationRequest {
  string employeeCode = 1;
  int32 periodId = 2;
  repeated EvaluationDetailInput details = 3;
}

message EvaluationDetailInput {
  int32 criteriaId = 1;
  float selfScore = 2;
  string notes = 3;
}

message EvaluationResponse {
  int32 id = 1;
  string employeeCode = 2;
  int32 periodId = 3;
  string status = 4;
  optional float totalScore = 5;
  optional float generalScoreFinal = 6;
  optional float taskScoreFinal = 7;
  optional string phase = 8;
  optional string employeeName = 9;
  optional string reviewerCode = 10;
  optional int32 departmentId = 11;
  optional string departmentName = 12;
  optional string jobTitle = 13;
  optional string periodName = 14;
}

message FindEvaluationsRequest {
  string employeeCode = 1;
  string currentEmployeeCode = 2;
  bool isAdmin = 3;
  bool isFetchingOwn = 4;
  repeated int32 callerDescendantUnitIds = 5;
  optional int32 page = 6;
  optional int32 limit = 7;
  optional int32 periodId = 8;
}

message EvaluationsResponse {
  bool success = 1;
  string message = 2;
  repeated EvaluationResponse data = 3;
  common.Meta meta = 4;
}

message CalculatePersonalKpiRequest {
  int32 periodId = 1;
  string employeeCode = 2;
  optional int32 staffingSlotId = 3;
}

message CalculatedTaskScore {
  int32 taskId = 1;
  string title = 2;
  float baseScore = 3;
  float finalScore = 4;
  string completedAt = 5;
  string dueDate = 6;
  string status = 7;
}

message CalculatePersonalKpiResponse {
  bool success = 1;
  string message = 2;
  float totalScore = 3;
  repeated CalculatedTaskScore tasks = 4;
  optional int32 evaluationId = 5;
  optional float taskScore = 6;
  optional float lgspPenalty = 7;
  optional int32 failedLgspCount = 8;
  optional string xmlContent = 9;
}

message GetEvaluationDetailRequest {
  int32 id = 1;
}

message KpiEvaluationDetailResponse {
  bool success = 1;
  string message = 2;
  string data = 3; // JSON string representation
}

message SubmitEvaluationRequest {
  int32 id = 1;
  string data = 2; // JSON string
}

message ApproveEvaluationRequest {
  int32 id = 1;
  string data = 2; // JSON string
  string reviewerCode = 3;
}

message GetEvaluationStatsRequest {
  string periodId = 1;
  bool isAdmin = 2;
  repeated int32 callerDescendantUnitIds = 3;
}

message KpiStatByUnit {
  int32 departmentId = 1;
  string departmentName = 2;
  int32 totalEvaluations = 3;
  float avgScore = 4;
}

message GetEvaluationStatsResponse {
  bool success = 1;
  string message = 2;
  message StatsData {
    int32 totalEvaluations = 1;
    float companyAvgScore = 2;
    repeated KpiStatByUnit statsByUnit = 3;
  }
  StatsData data = 3;
}

message FindFormTemplatesRequest {
  optional string organizationId = 1;
}

message FormTemplateItem {
  string formCode = 1;
  string name = 2;
  string description = 3;
  string templateFileId = 4;
  string createdAt = 5;
  string updatedAt = 6;
  string category = 7;
  string targetRole = 8;
  string schemaVersion = 9;
  int32 documentCount = 10;
  bool hasXmlFile = 11;
  int32 xmlSize = 12;
  string organizationId = 13;
  string status = 14;
  repeated string unitCodes = 15;
  repeated string processCodes = 16;
  int32 version = 17;
}

message FormTemplatesResponse {
  bool success = 1;
  string message = 2;
  repeated FormTemplateItem data = 3;
}

message GetFormTemplateDetailRequest {
  string formCode = 1;
  string organizationId = 2;
}

message FormTemplateDetailResponse {
  bool success = 1;
  string message = 2;
  FormTemplateItem data = 3;
  string xmlContent = 4;
  repeated string placeholders = 5;
}

message UpdateFormTemplateRequest {
  string formCode = 1;
  string name = 2;
  string description = 3;
  optional string templateFileId = 4;
  string organizationId = 5;
}

message GetFormTemplateXmlRequest {
  string formCode = 1;
  string organizationId = 2;
}

message FormTemplateXmlResponse {
  bool success = 1;
  string message = 2;
  string formCode = 3;
  string xmlContent = 4;
  repeated string placeholders = 5;
  int32 xmlSize = 6;
}

message SaveFormTemplateXmlRequest {
  string formCode = 1;
  string xmlContent = 2;
  string organizationId = 3;
}

message ValidateFormTemplateXmlRequest {
  string xmlContent = 1;
}

message ValidateFormTemplateXmlResponse {
  bool isValid = 1;
  string message = 2;
  optional string error = 3;
  repeated string placeholders = 4;
}

message CreateFormTemplateRequest {
  string name = 1;
  string description = 2;
  string category = 3;
  string targetRole = 4;
  string xmlContent = 5;
  string organizationId = 6;
  string createdBy = 7;
}

message FormTemplateBindingItem {
  int32 id = 1;
  string formCode = 2;
  string organizationId = 3;
  string unitCode = 4;
  string processDefinitionId = 5;
  string processCode = 6;
  string nodeCode = 7;
  string phase = 8;
  string effectiveFrom = 9;
  string effectiveTo = 10;
  bool isActive = 11;
  int32 templateVersion = 12;
}

message ListFormTemplateBindingsRequest {
  string formCode = 1;
  string organizationId = 2;
}

message FormTemplateBindingsResponse {
  bool success = 1;
  string message = 2;
  repeated FormTemplateBindingItem data = 3;
}

message CreateFormTemplateBindingRequest {
  string formCode = 1;
  string organizationId = 2;
  string unitCode = 3;
  string processDefinitionId = 4;
  string processCode = 5;
  string nodeCode = 6;
  string phase = 7;
  string effectiveFrom = 8;
  string effectiveTo = 9;
  string createdBy = 10;
}

message FormTemplateBindingResponse {
  bool success = 1;
  string message = 2;
  FormTemplateBindingItem data = 3;
}

message DeleteFormTemplateBindingRequest {
  int32 id = 1;
  string organizationId = 2;
}

message PublishFormTemplateRequest {
  string formCode = 1;
  string organizationId = 2;
  string publishedBy = 3;
}

message ResolveFormTemplateBindingRequest {
  string organizationId = 1;
  string unitCode = 2;
  string processDefinitionId = 3;
  string nodeCode = 4;
  string phase = 5;
}

message ResolvedFormTemplateResponse {
  bool success = 1;
  string message = 2;
  ResolvedFormTemplate data = 3;
}

message ResolvedFormTemplate {
  int32 bindingId = 3;
  string formCode = 4;
  string name = 5;
  string unitCode = 6;
  string processCode = 7;
  string nodeCode = 8;
  string phase = 9;
  int32 templateVersion = 10;
  string xmlContent = 11;
}

