syntax = "proto3";

package hrm;

import "common/common.proto";

service RankQuotaService {
  rpc SaveRankQuotas (SaveRankQuotasRequest) returns (SaveRankQuotasResponse) {}
  rpc GetRankQuotasByRank (GetRankQuotasByRankRequest) returns (RankQuotaList) {}
}

message RankQuota {
  int32 id = 1;
  string rankCode = 2;
  string domainCode = 9;
  string taskName = 3;
  string unit = 4;
  float targetValue = 5;
  float weight = 6;
  string createdAt = 7;
  string updatedAt = 8;
  int32 departmentId = 10;
  float monthlyTarget = 11;
  float quarterlyTarget = 12;
  float yearlyTarget = 13;
  string unitCode = 14;
}

message RankQuotaPayload {
  string taskName = 1;
  string unit = 2;
  float targetValue = 3;
  float weight = 4;
  int32 departmentId = 5;
  float monthlyTarget = 6;
  float quarterlyTarget = 7;
  float yearlyTarget = 8;
  string unitCode = 9;
}

message SaveRankQuotasRequest {
  string rankCode = 1;
  string domainCode = 3;
  repeated RankQuotaPayload quotas = 2;
  int32 departmentId = 4;
  string unitCode = 5;
}

message SaveRankQuotasResponse {
  bool success = 1;
  string message = 2;
  repeated RankQuota data = 3;
}

message GetRankQuotasByRankRequest {
  string rankCode = 1;
  string domainCode = 2;
  int32 departmentId = 3;
  string unitCode = 4;
}

message RankQuotaList {
  bool success = 1;
  string message = 2;
  repeated RankQuota data = 3;
}
